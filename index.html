<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>横スクロール・ソナー</title>
    <style>
        body {
            margin: 0;
            background-color: #000500; /* 深海をイメージした超暗い緑 */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #start-btn {
            position: relative;
            z-index: 10;
            cursor: pointer;
            border: 2px solid #00ff00;
            padding: 15px 30px;
            background: rgba(0, 20, 0, 0.8);
            font-size: 18px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="start-btn">SONAR SYSTEM START</div>
    <canvas id="sonarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sonarCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // リサイズ時に背景を一度黒にする
            ctx.fillStyle = '#000500';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            
            try {
                // 1. マイクアクセスと音声解析の準備
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                
                // fftSizeを大きくすると、縦方向（周波数）の解像度が上がります
                analyser.fftSize = 512; 
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // スクロール速度（1フレームに何ピクセル左にずらすか）
                // ここを小さくするほど「ゆっくり」流れます
                const scrollSpeed = 1.5; 

                function draw() {
                    requestAnimationFrame(draw);

                    // --- 1. 画面全体を左にシフトさせる（ここが重要！） ---
                    // 一時的に現在の画面をキャプチャして、少し左にずらして描き直す
                    ctx.drawImage(canvas, scrollSpeed, 0, canvas.width - scrollSpeed, canvas.height, 0, 0, canvas.width - scrollSpeed, canvas.height);

                    // --- 2. 右端の最新データ部分を一度クリアする ---
                    ctx.fillStyle = '#000500';
                    ctx.fillRect(canvas.width - scrollSpeed, 0, scrollSpeed, canvas.height);

                    // --- 3. マイクの周波数データを取得 ---
                    analyser.getByteFrequencyData(dataArray);

                    // --- 4. 右端の1ラインに、音データを縦に並べて描画 ---
                    // 低音を下に、高音を上に配置します
                    const sliceHeight = canvas.height / bufferLength;

                    for (let i = 0; i < bufferLength; i++) {
                        const value = dataArray[i]; // 0 〜 255 の値
                        const percent = value / 255;

                        // 音が立っている（強い）部分だけ緑〜明るい緑で発光させる
                        if (value > 10) {
                            // 潜水艦の液晶っぽく、緑の輝度を音量に合わせる
                            const green = Math.floor(percent * 200) + 55;
                            ctx.fillStyle = `rgb(0, ${green}, 0)`;
                            
                            // 右端の隙間に、縦に細長い長方形を敷き詰めていく
                            const y = canvas.height - (i * sliceHeight);
                            ctx.fillRect(canvas.width - scrollSpeed, y, scrollSpeed, sliceHeight);
                        }
                    }

                    // ソナーのグリッド線（横線）を右端にうっすら重ねる
                    drawOverlayGrid();
                }

                draw();

            } catch (err) {
                alert('マイクの許可が必要です。');
                console.error(err);
                startBtn.style.display = 'block';
            }
        });

        // 雰囲気を出すためのうっすらとした水平グリッド線
        function drawOverlayGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.02)';
            ctx.lineWidth = 1;
            const gridSpacing = canvas.height / 10;
            
            ctx.beginPath();
            for (let y = gridSpacing; y < canvas.height; y += gridSpacing) {
                ctx.moveTo(canvas.width - 2, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }
    </script>
</body>
</html>
