<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本格ウォーターフォール・ソナー</title>
    <style>
        body {
            margin: 0;
            background-color: #000500;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #start-btn {
            position: relative;
            z-index: 10;
            cursor: pointer;
            border: 2px solid #00ff00;
            padding: 15px 30px;
            background: rgba(0, 20, 0, 0.8);
            font-size: 18px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="start-btn">SONAR SYSTEM START</div>
    <canvas id="sonarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sonarCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 初回およびリサイズ時に背景を深海色で初期化
            ctx.fillStyle = '#000500';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 512; 
                source.connect(analyser);

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // スクロール速度（1フレームに進むピクセル数）
                // 1にするとよりクッキリ滑らかに、数値を下げるとさらにゆっくり流れます
                const scrollSpeed = 1; 

                function draw() {
                    requestAnimationFrame(draw);

                    // --- 1. 画面の絵を完全に複製して左にずらす ---
                    // 前回のコードと違い、背景を「透過」させずにそのままピクセル移動させます
                    ctx.drawImage(
                        canvas, 
                        scrollSpeed, 0, canvas.width - scrollSpeed, canvas.height, // 元の画像（少し右側を切り取る）
                        0, 0, canvas.width - scrollSpeed, canvas.height            // 貼り付け先（左端に寄せる）
                    );

                    // --- 2. 新しいデータが入る右端の隙間をリセット ---
                    ctx.fillStyle = '#000500';
                    ctx.fillRect(canvas.width - scrollSpeed, 0, scrollSpeed, canvas.height);

                    // --- 3. 音声データの取得 ---
                    analyser.getByteFrequencyData(dataArray);

                    // --- 4. 右端の1ラインを描画 ---
                    const sliceHeight = canvas.height / bufferLength;

                    for (let i = 0; i < bufferLength; i++) {
                        const value = dataArray[i]; 
                        const percent = value / 255;

                        // 縦軸（Y座標）：上が高音、下が低音
                        const y = canvas.height - (i * sliceHeight);

                        if (value > 15) {
                            // 音が強いほど、明るい黄緑〜白に近い緑に変化（発光感を出す）
                            const green = Math.min(255, Math.floor(percent * 200) + 100);
                            const red = Math.floor(percent * 80); // 強い音は少し黄色みがかる
                            
                            ctx.fillStyle = `rgb(${red}, ${green}, ${red})`;
                            ctx.fillRect(canvas.width - scrollSpeed, y, scrollSpeed, sliceHeight);
                        } else {
                            // 音がない場所は、うっすらとした環境ノイズ（深海のノイズ）として
                            // ごく暗い緑を残しておくと、よりソナーっぽくなります
                            ctx.fillStyle = '#000c00';
                            ctx.fillRect(canvas.width - scrollSpeed, y, scrollSpeed, sliceHeight);
                        }
                    }
                }

                draw();

            } catch (err) {
                alert('マイクの許可が必要です。');
                console.error(err);
                startBtn.style.display = 'block';
            }
        });
    </script>
</body>
</html>
